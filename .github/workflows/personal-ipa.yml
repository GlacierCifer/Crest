name: Personal unsigned IPA

# Builds the iPhone app without signing, so it can be re-signed on a device
# with a personal certificate. Nothing here publishes or notarizes anything.

on:
  workflow_dispatch:
  push:
    branches: [personal/ipa]

permissions:
  contents: read

concurrency:
  group: personal-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare-apple-build

      - name: Archive the iPhone app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Crest.xcodeproj \
            -scheme "CrestMobile Production" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Crest.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package the unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Crest.xcarchive/Products/Applications/Crest.app" "$RUNNER_TEMP/Payload/Crest.app"
          cd "$RUNNER_TEMP"
          zip -qry Crest-personal.ipa Payload
          ls -lh Crest-personal.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Crest-personal-ipa
          path: ${{ runner.temp }}/Crest-personal.ipa
          if-no-files-found: error
